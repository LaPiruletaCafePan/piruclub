<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La PiruClub · Club de socios de La Piruleta</title>
<meta name="description" content="Hazte socio de La Piruleta: suma puntos, sube de nivel y disfruta de promociones exclusivas.">
<meta name="theme-color" content="#0E6878">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PiruClub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --fondo:#FFFFFF; --suelo:#F3F8F9; --turquesa:#1B97AE; --turquesa-osc:#0E6878; --noche:#0A4652; --piruleta:#E8507A;
  --tinta:#16343A; --suave:#5E7479; --linea:#E3ECEE; --aviso:#C62828; --ok:#1E8E5A;
  --bronce:#C98A55; --plata:#AEB9C0; --oro:#E2B84A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#10232A; --suelo:#0B1A1F; --turquesa:#3FB6CB; --turquesa-osc:#8ED9E6; --noche:#06262E; --piruleta:#FF7FA2;
    --tinta:#E9F4F6; --suave:#9CB4B9; --linea:#22414A; --aviso:#FF9A9A; --ok:#5FD39C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#10232A; --suelo:#0B1A1F; --turquesa:#3FB6CB; --turquesa-osc:#8ED9E6; --noche:#06262E; --piruleta:#FF7FA2;
  --tinta:#E9F4F6; --suave:#9CB4B9; --linea:#22414A; --aviso:#FF9A9A; --ok:#5FD39C;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--suelo);color:var(--tinta);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--noche)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--turquesa-osc)}
:focus-visible{outline:3px solid var(--piruleta);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;background:var(--fondo);min-height:100vh;position:relative}
.con-nav{padding-bottom:96px}
h1,h2,h3{margin:0}
.titulo{font-family:"Baloo 2","Figtree",sans-serif;font-weight:800;color:var(--turquesa-osc);line-height:1.1}
.bloque{padding:18px 18px 0}
.nota{color:var(--suave);font-size:14.5px;margin:4px 0 0}
.centrado{text-align:center}

/* ---------- Botones y formularios ---------- */
.boton{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:999px;border:1.5px solid var(--linea);
  background:var(--fondo);color:var(--tinta);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.boton.rosa{background:var(--piruleta);border-color:var(--piruleta);color:#fff}
.boton.turquesa{background:var(--turquesa);border-color:var(--turquesa);color:#fff}
.boton.peq{width:auto;padding:9px 15px;font-size:14.5px}
.boton.peligro{color:var(--aviso);border-color:var(--aviso)}
.boton:disabled{opacity:.55;cursor:default}
.enlace{background:none;border:0;padding:0;color:var(--turquesa-osc);font-weight:700;text-decoration:underline;cursor:pointer}
.campo{display:block;margin:0 0 14px}
.campo > span{display:block;font-size:14px;font-weight:700;margin:0 0 5px}
.campo input,.campo select,.campo textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:13px;border:1.5px solid var(--linea);background:var(--suelo);color:var(--tinta)}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--turquesa)}
.campo small{display:block;color:var(--suave);font-size:13px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--turquesa)}
.error{color:var(--aviso);font-weight:700;font-size:14.5px;min-height:20px;margin:0 0 10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pila{display:grid;gap:10px}

/* ---------- Portada (sin sesión) ---------- */
.toldo{height:84px;position:relative;background:repeating-linear-gradient(90deg,var(--turquesa) 0 28px,#FFFFFF 28px 56px);
  -webkit-mask:radial-gradient(14px at 50% 100%,#0000 98%,#000) 0 0/28px 100%;mask:radial-gradient(14px at 50% 100%,#0000 98%,#000) 0 0/28px 100%}
.toldo::after{content:"";position:absolute;inset:0 0 auto;height:22px;background:linear-gradient(rgba(0,0,0,.18),transparent)}
.portada{text-align:center;padding:0 20px;margin-top:-32px;position:relative}
.logo{width:112px;height:112px;border-radius:50%;margin:0 auto;object-fit:cover;background:#fff;box-shadow:0 0 0 5px var(--fondo),0 8px 24px rgba(14,104,120,.22)}
.portada h1{font-size:36px;margin:12px 0 0}
.ventajas{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;text-align:left}
.ventajas li{display:flex;gap:12px;align-items:center;font-size:15.5px}
.ventajas .ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--suelo);color:var(--turquesa-osc)}
.ventajas .ic svg{width:22px;height:22px}
.instalar{margin:22px 0 0;padding:16px;border-radius:20px;border:2px dashed var(--turquesa);text-align:left}
.instalar h3{font-size:17px;margin:0 0 6px}
.instalar ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.instalar ol li{margin:4px 0}
.instalar .qr{width:150px;margin:10px auto 0;background:#fff;padding:8px;border-radius:12px}

/* ---------- Cabecera del socio (estilo club) ---------- */
.cab{background:linear-gradient(160deg,var(--noche),var(--turquesa-osc) 55%,var(--turquesa));color:#fff;padding:18px 18px 22px;border-radius:0 0 26px 26px;text-align:center;position:relative}
:root[data-theme="dark"] .cab,.cab{--tx:#fff}
.cab .saludo{font-size:15px;opacity:.9;margin:0}
.arco{position:relative;width:250px;max-width:80%;margin:6px auto 0}
.arco svg{width:100%;display:block;overflow:visible}
.medalla{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 0 0 6px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.35)}
.medalla svg{width:46px;height:46px}
.marcas{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin:-8px 4px 0;opacity:.95}
.marcas span small{display:block;font-weight:600;opacity:.75}
.cifras{display:flex;justify-content:center;gap:0;margin:12px 0 0}
.cifras div{padding:0 18px}
.cifras div + div{border-left:1.5px solid rgba(255,255,255,.35)}
.cifras small{display:block;font-size:13px;opacity:.85}
.cifras b{font-family:"Baloo 2","Figtree",sans-serif;font-size:34px;line-height:1}
.siguiente{margin:10px 0 0;font-size:14px;opacity:.95}
.caduca{display:inline-block;margin:10px 0 0;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.15);font-size:13px;font-weight:600}

.verificar{margin:0 0 14px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--piruleta) 10%,var(--fondo));border:1.5px solid color-mix(in srgb,var(--piruleta) 40%,var(--fondo))}
.verificar b{color:var(--tinta)}
.verificar p{margin:4px 0 0;font-size:14.5px;color:var(--suave)}

/* ---------- Tarjetas de acceso rápido ---------- */
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mosaico{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;border:1.5px solid var(--linea);background:var(--fondo);cursor:pointer;text-align:left;min-height:110px}
.mosaico svg{width:28px;height:28px;color:var(--turquesa)}
.mosaico b{font-size:16px;line-height:1.25}
.seccion-t{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.seccion-t h2{font-size:21px}

/* ---------- Promociones ---------- */
.promo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:1.5px solid var(--linea);background:var(--fondo);margin:0 0 10px}
.promo .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--piruleta) 14%,var(--fondo));color:var(--piruleta)}
.promo .ic svg{width:24px;height:24px}
.promo b{display:block;font-size:16px;line-height:1.25}
.promo p{margin:3px 0 0;color:var(--suave);font-size:14.5px}
.promo .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.etq{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--suelo);color:var(--suave)}
.etq.bronce{background:color-mix(in srgb,var(--bronce) 25%,var(--fondo));color:#7A4A22}
.etq.plata{background:color-mix(in srgb,var(--plata) 35%,var(--fondo));color:#4A5860}
.etq.oro{background:color-mix(in srgb,var(--oro) 30%,var(--fondo));color:#7A5A0A}
.promo.bloqueada{opacity:.6}
.promo.bloqueada .ic{background:var(--suelo);color:var(--suave)}
.promo .derecha{margin-left:auto;flex:none}
.vacio{padding:24px 16px;text-align:center;color:var(--suave);border:1.5px dashed var(--linea);border-radius:18px}

/* ---------- Niveles ---------- */
.nivel{border:1.5px solid var(--linea);border-radius:18px;margin:0 0 10px;overflow:hidden}
.nivel summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.nivel summary::-webkit-details-marker{display:none}
.nivel .bola{width:34px;height:34px;border-radius:50%;flex:none}
.nivel summary b{display:block}
.nivel summary small{color:var(--suave)}
.nivel .flecha{margin-left:auto;transition:transform .2s}
.nivel[open] .flecha{transform:rotate(180deg)}
.nivel .dentro{padding:0 14px 14px 60px;color:var(--suave);font-size:14.5px;white-space:pre-line}
.nivel.actual{border-color:var(--turquesa)}
.chip-actual{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--turquesa);color:#fff;font-size:11.5px;font-weight:800;vertical-align:2px}

/* ---------- Historial ---------- */
.mov{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:0}
.mov .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--suelo);color:var(--turquesa)}
.mov .ic svg{width:20px;height:20px}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-size:15.5px;font-weight:700}
.mov .txt small{color:var(--suave)}
.mov .pts{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .pts.mas{color:var(--ok)}
.mov .pts.menos{color:var(--suave)}

/* ---------- Tarjeta de socio ---------- */
.carnet{margin:18px;border-radius:24px;padding:18px;color:#3A2A08;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.carnet.bronce{background:linear-gradient(135deg,#E9B88A,#C98A55);color:#3B220C}
.carnet.plata{background:linear-gradient(135deg,#E7EDF0,#AEB9C0);color:#26333A}
.carnet.oro{background:linear-gradient(135deg,#F6DE8E,#E2B84A);color:#3A2A08}
.carnet .arriba{display:flex;justify-content:space-between;align-items:center}
.carnet .marca{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;line-height:1}
.carnet .marca small{display:block;font-family:"Figtree",sans-serif;font-size:13px;font-weight:700;opacity:.8}
.carnet .minilogo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover}
.carnet .qr{background:#fff;border-radius:18px;padding:14px;margin:16px auto 0;max-width:270px}
.carnet .qr svg{width:100%;height:auto;display:block}
.carnet .num{text-align:center;font-weight:800;font-size:18px;letter-spacing:.06em;margin:12px 0 0;font-variant-numeric:tabular-nums}
.carnet .abajo{display:flex;justify-content:space-between;margin-top:12px;font-size:14px;font-weight:700}
.brillo{font-size:13.5px;color:var(--suave);text-align:center;margin:0 18px}

/* ---------- Barra inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
.nav .dentro{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--fondo);border-top:1px solid var(--linea);display:flex;justify-content:space-around;align-items:flex-end;
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--suave);cursor:pointer;padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button.activo{color:var(--turquesa-osc)}
.nav button.central .bola{width:60px;height:60px;border-radius:50%;background:var(--piruleta);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(232,80,122,.45)}
.nav button.central .bola svg{width:28px;height:28px}

/* ---------- Panel del local ---------- */
.pestanas{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--linea);background:var(--fondo);font-weight:700;font-size:14.5px;cursor:pointer;color:var(--suave)}
.pestanas button.activo{background:var(--tinta);border-color:var(--tinta);color:var(--fondo)}
.lector{border-radius:18px;overflow:hidden;background:#000;min-height:260px}
.ficha{border:1.5px solid var(--linea);border-radius:20px;padding:16px}
.ficha .quien{display:flex;gap:12px;align-items:center}
.ficha .bola{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px}
.ficha h3{font-size:19px}
.ficha .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0;text-align:center}
.ficha .datos div{background:var(--suelo);border-radius:12px;padding:8px 4px}
.ficha .datos b{display:block;font-size:18px}
.ficha .datos small{color:var(--suave);font-size:12.5px}
.aviso-cumple{margin:12px 0 0;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--piruleta) 14%,var(--fondo));color:var(--piruleta);font-weight:700;font-size:14.5px}
.importe{display:flex;gap:8px;align-items:stretch}
.importe input{flex:1;min-width:0;font:inherit;font-size:26px;font-weight:800;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--linea);background:var(--suelo);color:var(--tinta)}
.importe input:focus{outline:none;border-color:var(--turquesa)}
.vista-pts{text-align:center;color:var(--suave);font-size:14.5px;margin:8px 0 12px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .txt{min-width:0}
.fila .txt b{display:block}
.fila .txt small{color:var(--suave)}
.cifra-grande{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:30px;color:var(--turquesa-osc);line-height:1}

/* ---------- Capas ---------- */
.velo{position:fixed;inset:0;background:rgba(6,25,30,.55);z-index:50;display:none}
.velo.ver{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--fondo);border-radius:24px 24px 0 0;max-width:520px;margin:0 auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-height:90vh;overflow:auto}
.hoja.ver{transform:none}
.hoja h2{font-size:20px;margin:0 0 6px}
.hoja .texto-legal{font-size:14px;color:var(--suave)}
.hoja .texto-legal h3{font-size:15px;color:var(--tinta);margin:14px 0 4px}
.hoja .texto-legal p{margin:0 0 6px}
.botones{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#aviso{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .15s;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#aviso.ver{opacity:1}
.cargando{display:grid;place-items:center;min-height:70vh;color:var(--suave)}
.giro{width:38px;height:38px;border-radius:50%;border:4px solid var(--linea);border-top-color:var(--turquesa);animation:giro .8s linear infinite;margin:0 auto 12px}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.hoja{transition:none}.giro{animation-duration:2.5s}}
</style>
</head>
<body>
<div class="app" id="app"><div class="cargando"><div><div class="giro"></div>Cargando…</div></div></div>
<nav class="nav" id="nav" hidden></nav>
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true"></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script>
/* Diagnóstico: si la app no consigue arrancar, mostrar el motivo en vez de quedarse girando */
window.__arranco = false; window.__errores = [];
window.addEventListener("error", function(e){ window.__errores.push((e.message || "Error") + (e.filename ? " [" + e.filename.split("/").pop() + ":" + (e.lineno || "") + "]" : "")); if (!window.__arranco) setTimeout(mostrarFallo, 300); }, true);
window.addEventListener("unhandledrejection", function(e){ window.__errores.push("Promesa: " + ((e.reason && (e.reason.code || e.reason.message)) || e.reason)); });
function mostrarFallo(){
  if (window.__arranco) return;
  var a = document.getElementById("app"); if (!a || !a.querySelector(".cargando")) return;
  var det = window.__errores.length ? window.__errores.join("<br>") : "Sin errores registrados (la conexión con Firebase no responde).";
  a.innerHTML = '<div style="padding:40px 22px;text-align:center;font-family:system-ui,sans-serif"><h2 style="color:#0E6878">No se ha podido abrir La PiruClub</h2>'
    + '<p style="color:#5E7479">Haz una captura de esta pantalla y envíasela a quien te ayuda con la app.</p>'
    + '<p style="font-family:monospace;font-size:12px;text-align:left;background:#f3f8f9;color:#16343A;padding:10px;border-radius:10px;word-break:break-word">' + det.replace(/</g,"&lt;").replace(/&lt;br>/g,"<br>") + '<br>Navegador: ' + navigator.userAgent.replace(/</g,"") + '</p>'
    + '<button onclick="location.reload()" style="padding:12px 22px;border-radius:999px;border:0;background:#1B97AE;color:#fff;font-weight:700;font-size:16px">Reintentar</button></div>';
}
setTimeout(mostrarFallo, 20000);
</script>

const S = {
  user: null, socio: null, staff: null, ajustes: structuredClone(DEFECTO), promos: [], movs: [],
  vista: "cargando", local: {pestana: "escanear", ficha: null}, subs: [], registrando: false
};
function limpiarSubs(){ S.subs.forEach(u => { try{ u(); }catch(e){} }); S.subs = []; }

/* Ajustes y promociones (públicos) */
onSnapshot(doc(db, "config", "ajustes"), s => {
  if (s.exists()){
    const d = s.data();
    S.ajustes = {
      puntosPorEuro: +d.puntosPorEuro || DEFECTO.puntosPorEuro,
      caducidadMeses: +d.caducidadMeses || DEFECTO.caducidadMeses,
      niveles: Array.isArray(d.niveles) && d.niveles.length === 3 ? d.niveles : DEFECTO.niveles
    };
  }
  pintar();
}, () => {});
onSnapshot(collection(db, "promos"), s => {
  S.promos = s.docs.map(d => ({id: d.id, ...d.data()}));
  pintar();
}, () => {});

/* ---------------------------- Cálculos ---------------------------- */
function niveles(){ return [...S.ajustes.niveles].sort((a, b) => a.min - b.min); }
function calcular(movs){
  const ahora = Date.now();
  let puntos = 0; const vivos = [], caducados = [];
  for (const m of movs){
    if (m.tipo === "suma" || m.tipo === "ajuste"){
      if (ms(m.caduca) > ahora){ puntos += m.puntos || 0; vivos.push(m); }
      else caducados.push(m);
    }
  }
  puntos = Math.max(0, puntos);
  const ns = niveles();
  let nivel = ns[0];
  for (const n of ns) if (puntos >= n.min) nivel = n;
  const siguiente = ns.find(n => n.min > puntos) || null;
  const pronto = vivos.filter(m => m.tipo === "suma" && ms(m.caduca) - ahora < 30 * DIA).sort((a, b) => ms(a.caduca) - ms(b.caduca));
  const caducaPronto = pronto.length ? {puntos: pronto.reduce((s, m) => s + m.puntos, 0), fecha: pronto[0].caduca} : null;
  const canjes = movs.filter(m => m.tipo === "canje");
  return {puntos, nivel, siguiente, caducados, canjes, caducaPronto};
}
function estadoPromo(p, socio, calc){
  if (!p.activa) return "oculta";
  const hoy = hoyISO();
  if (p.desde && hoy < p.desde) return "oculta";
  if (p.hasta && hoy > p.hasta) return "oculta";
  const usadas = calc.canjes.filter(c => c.promoId === p.id);
  if (p.tipo === "cumple"){
    if (!socio?.nacimiento || +socio.nacimiento.slice(5, 7) !== mesActual()) return "oculta";
    if (usadas.some(c => new Date(ms(c.fecha) || Date.now()).getFullYear() === anioActual())) return "usada";
  } else if (p.tipo === "bienvenida"){
    if (usadas.length) return "usada";
    if (Date.now() - (ms(socio?.alta) || Date.now()) > 30 * DIA) return "oculta";
    if (socio?.emailVerificado !== true && !(socio?.id && socio.id === S.user?.uid && auth.currentUser?.emailVerified)) return "verificar";
  } else if (p.usos !== "ilimitada" && usadas.length) return "usada";
  if ((ORDEN[p.nivel] ?? 0) > (ORDEN[calc.nivel.id] ?? 0)) return "bloqueada";
  return "disponible";
}
function nombreNivel(id){ return (S.ajustes.niveles.find(n => n.id === id) || {nombre: may(id)}).nombre; }

/* ----------------------- Verificación de email ----------------------- */
const URL_APP = location.origin + location.pathname;
async function enviarVerificacion(u){
  if (!u.displayName && S.socio?.nombre) await updateProfile(u, {displayName: S.socio.nombre}).catch(() => {});
  return sendEmailVerification(u, {url: URL_APP});
}
let comprobando = false;
async function comprobarVerificacion(avisarSiNo){
  const u = auth.currentUser; if (!u || comprobando) return;
  comprobando = true;
  try{
    await u.reload();
    if (auth.currentUser?.emailVerified){
      await auth.currentUser.getIdToken(true);
      if (S.socio && S.socio.emailVerificado !== true) await updateDoc(doc(db, "socios", u.uid), {emailVerificado: true});
      if (avisarSiNo !== undefined) avisar("¡Email confirmado! Gracias");
    } else if (avisarSiNo) avisar("Aún no aparece confirmado. Revisa tu correo");
  }catch(e){ if (avisarSiNo) avisar(textoError(e)); }
  finally{ comprobando = false; pintar(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && auth.currentUser && S.socio && S.socio.emailVerificado !== true) comprobarVerificacion(); });
const emailOk = () => !!auth.currentUser?.emailVerified || S.socio?.emailVerificado === true;
function bannerVerificar(){
  if (!S.user || emailOk()) return "";
  return `<div class="verificar"><b>Confirma tu email</b><p>Te hemos enviado un enlace a <b>${esc(S.user.email)}</b>. Al confirmarlo podrás usar tu regalo de bienvenida. Mira también en «Spam» o «Promociones».</p>
    <div class="botones" style="justify-content:flex-start;margin-top:10px"><button class="boton turquesa peq" type="button" id="btnYaVerifique">Ya lo he confirmado</button><button class="boton peq" type="button" id="btnReenviar">Reenviar email</button></div></div>`;
}

/* ------------------------------ Sesión ------------------------------ */
onAuthStateChanged(auth, async user => {
  limpiarSubs();
  S.user = user; S.socio = null; S.staff = null; S.movs = [];
  if (!user){ S.vista = "portada"; pintar(); return; }
  S.vista = "cargando"; pintar();
  try{
    const st = await getDoc(doc(db, "staff", user.uid));
    S.staff = st.exists() ? st.data() : null;
  }catch(e){ S.staff = null; }
  if (!user.emailVerified) setTimeout(() => comprobarVerificacion(), 1500);
  S.subs.push(onSnapshot(doc(db, "socios", user.uid), s => {
    S.socio = s.exists() ? {id: s.id, ...s.data()} : null;
    if (S.registrando && !S.socio) return;
    if (S.socio && S.socio.emailVerificado !== true && auth.currentUser?.emailVerified) comprobarVerificacion();
    if (S.vista === "cargando") S.vista = S.socio ? "inicio" : (S.staff ? "local" : "completar");
    pintar();
  }, e => { S.fallo = "No se ha podido leer tu cuenta (" + (e?.code || "error") + "). Si eres el administrador, revisa las reglas de Firestore."; S.vista = "fallo"; pintar(); }));
  let primera = true;
  S.subs.push(onSnapshot(query(collection(db, "socios", user.uid, "movimientos"), orderBy("fecha", "desc"), limit(250)), s => {
    const antes = calcular(S.movs).puntos;
    S.movs = s.docs.map(d => ({id: d.id, ...d.data()}));
    const ahora = calcular(S.movs).puntos;
    if (!primera && ahora > antes) avisar(`¡Has sumado ${ahora - antes} puntos!`);
    primera = false;
    pintar();
  }, () => {}));
});

/* ----------------------------- Pintado ----------------------------- */
function ir(v){ S.vista = v; pintar(); window.scrollTo(0, 0); }
function pintar(){
  const app = $("#app"), nav = $("#nav");
  const conNav = ["inicio", "tarjeta", "promos", "perfil", "historial", "local"].includes(S.vista);
  nav.hidden = !conNav; app.classList.toggle("con-nav", conNav);
  const V = {cargando: vCargando, portada: vPortada, registro: vRegistro, entrar: vEntrar, completar: vCompletar,
    fallo: vFallo, inicio: vInicio, tarjeta: vTarjeta, promos: vPromos, perfil: vPerfil, historial: vHistorial, local: vLocal};
  app.innerHTML = (V[S.vista] || vCargando)();
  if (conNav) nav.innerHTML = vNav();
  despues();
}
function despues(){
  if (S.vista === "tarjeta" && S.user){
    const caja = $("#qrSocio");
    if (caja && window.qrcode){
      const q = qrcode(0, "M"); q.addData("PIRU:" + S.user.uid); q.make();
      caja.innerHTML = q.createSvgTag({cellSize: 8, margin: 2, scalable: true});
    }
  }
  if (S.vista === "portada") prepararInstalar();
  if (S.vista === "local" && S.local.pestana === "socios") cargarSocios();
  if (S.vista === "local" && S.local.pestana === "equipo") cargarEquipo();
}

let promptInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; if (S.vista === "portada") prepararInstalar(); });
const esIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const esAndroid = () => /Android/i.test(navigator.userAgent);
const instalada = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function prepararInstalar(){
  const c = $("#instalar"); if (!c || instalada()) return;
  if (esAndroid()){
    if (ENLACE_GOOGLE_PLAY){
      c.innerHTML = `<h3>Descarga la app</h3><p class="nota">Tenla siempre a mano en tu móvil.</p><a class="boton turquesa" style="margin-top:10px" href="${ENLACE_GOOGLE_PLAY}">Descargar en Google Play</a>`;
    } else if (promptInstalar){
      c.innerHTML = `<h3>Instala la app</h3><p class="nota">Tendrás tu tarjeta de socio en la pantalla de inicio, como cualquier app.</p><button class="boton turquesa" style="margin-top:10px" type="button" id="btnInstalar">Instalar La PiruClub</button>`;
      $("#btnInstalar").onclick = async () => { promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar = null; c.hidden = true; };
    } else {
      c.innerHTML = `<h3>Instala la app</h3><ol><li>Toca los tres puntos <b>⋮</b> de Chrome, arriba a la derecha.</li><li>Toca <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li></ol>`;
    }
  } else if (esIOS()){
    c.innerHTML = `<h3>Instálala en tu iPhone</h3><p class="nota">Así tendrás tu tarjeta en la pantalla de inicio.</p><ol>
      <li>Toca el botón <b>Compartir</b> (el cuadrado con la flecha ⬆️) en la barra de Safari.</li>
      <li>Baja y toca <b>Añadir a pantalla de inicio</b>.</li><li>Toca <b>Añadir</b>.</li></ol>`;
  } else {
    let qr = "";
    if (window.qrcode){ const q = qrcode(0, "M"); q.addData(location.href.split("#")[0]); q.make(); qr = `<div class="qr">${q.createSvgTag({cellSize: 6, margin: 1, scalable: true})}</div>`; }
    c.innerHTML = `<h3>Ábrela en tu móvil</h3><p class="nota">La PiruClub está pensada para el móvil. Escanea este código con la cámara.</p>${qr}`;
  }
  c.hidden = false;
}

async function crearFichaSocio(uid, email){
  const nombre = $("#rNombre").value.trim(), nac = $("#rNac").value;
  await setDoc(doc(db, "socios", uid), {
    nombre, email: (email || "").toLowerCase(), nacimiento: nac,
    numero: String(Math.floor(100000000 + Math.random() * 900000000)),
    alta: serverTimestamp(), marketing: $("#rMarketing").checked,
    legal: {version: VERSION_LEGAL, fecha: serverTimestamp()}
  });
}
function validarDatos(err){
  if (!$("#rNombre").value.trim()){ err.textContent = "Escribe tu nombre."; return false; }
  if (!$("#rNac").value){ err.textContent = "Indica tu fecha de nacimiento."; return false; }
  if (!$("#rLegal").checked){ err.textContent = "Tienes que aceptar las condiciones y la privacidad."; return false; }
  return true;
}
async function registrar(){
  const err = $("#rError"); err.textContent = "";
  const email = $("#rEmail").value.trim().toLowerCase(), pass = $("#rPass").value;
  if (!validarDatos(err)) return;
  if (!email){ err.textContent = "Escribe tu email."; return; }
  const b = $("#btnRegistro"); b.disabled = true; b.textContent = "Creando tu cuenta…";
  let datos = null;
  try{
    S.vista = "cargando"; S.registrando = true;
    datos = {nombre: $("#rNombre").value, nac: $("#rNac").value, mk: $("#rMarketing").checked};
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, {displayName: datos.nombre.trim()}).catch(() => {});
    enviarVerificacion(cred.user).catch(() => {});
    await setDoc(doc(db, "socios", cred.user.uid), {
      nombre: datos.nombre.trim(), email, nacimiento: datos.nac,
      numero: String(Math.floor(100000000 + Math.random() * 900000000)),
      alta: serverTimestamp(), marketing: datos.mk, legal: {version: VERSION_LEGAL, fecha: serverTimestamp()}
    });
    S.registrando = false; S.vista = "inicio"; pintar(); avisar("¡Bienvenido a La PiruClub!");
  }catch(e){
    S.registrando = false;
    const vals = {n: datos?.nombre, e: email, nac: datos?.nac};
    if (auth.currentUser && !S.socio){ S.vista = "completar"; pintar(); }
    else { S.vista = "registro"; pintar(); $("#rNombre").value = vals.n || ""; $("#rEmail").value = vals.e || ""; $("#rNac").value = vals.nac || ""; }
    $("#rError").textContent = textoError(e);
  }
}
async function completar(){
  const err = $("#rError"); err.textContent = "";
  if (!validarDatos(err)) return;
  try{ await crearFichaSocio(S.user.uid, S.user.email); S.vista = "inicio"; avisar("¡Bienvenido a La PiruClub!"); }
  catch(e){ err.textContent = textoError(e); }
}
async function entrar(){
  const err = $("#eError"); err.textContent = "";
  const b = $("#btnEntrar"); b.disabled = true; b.textContent = "Entrando…";
  try{ S.vista = "cargando"; await signInWithEmailAndPassword(auth, $("#eEmail").value.trim(), $("#ePass").value); }
  catch(e){ const email = $("#eEmail")?.value; S.vista = "entrar"; pintar(); $("#eEmail").value = email || ""; $("#eError").textContent = textoError(e); }
}
async function olvido(){
  const email = $("#eEmail").value.trim(), err = $("#eError");
  if (!email){ err.textContent = "Escribe tu email arriba y vuelve a tocar aquí."; return; }
  try{ await sendPasswordResetEmail(auth, email); err.textContent = ""; avisar("Te hemos enviado un email para cambiar la contraseña"); }
  catch(e){ err.textContent = textoError(e); }
}

/* ---------- Inicio del socio ---------- */
function cabecera(c){
  const ns = niveles(), p = c.puntos;
  // El arco va de Bronce (izquierda) a Plata (arriba) y a Oro (derecha)
  const prog = p >= ns[2].min ? 1 : p >= ns[1].min ? 0.5 + 0.5 * (p - ns[1].min) / (ns[2].min - ns[1].min) : 0.5 * p / Math.max(1, ns[1].min);
  const L = 251.3; // longitud del arco
  return `<header class="cab">
    <p class="saludo">Hola, ${esc(S.socio?.nombre || "socio")}</p>
    <div class="arco">
      <svg viewBox="0 0 200 120" aria-hidden="true">
        <path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12" stroke-linecap="round"/>
        <path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="#7FE3F2" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(L * prog).toFixed(1)} ${L}"/>
      </svg>
      <div class="medalla" style="background:${COLOR[c.nivel.id]}">${I.piruleta}</div>
    </div>
    <div class="marcas"><span>${esc(ns[0].nombre)}<small>${ns[0].min} pts</small></span><span>${esc(ns[1].nombre)}<small>${ns[1].min} pts</small></span><span>${esc(ns[2].nombre)}<small>${ns[2].min}+ pts</small></span></div>
    <div class="cifras"><div><small>Nivel actual</small><b>${esc(c.nivel.nombre)}</b></div><div><small>Puntos</small><b>${c.puntos.toLocaleString("es-ES")}</b></div></div>
    <p class="siguiente">${c.siguiente ? `Te faltan <b>${c.siguiente.min - c.puntos}</b> puntos para ${esc(c.siguiente.nombre)}` : "¡Estás en el nivel más alto!"}</p>
    ${c.caducaPronto ? `<span class="caduca">${c.caducaPronto.puntos} puntos caducan el ${fechaCorta(c.caducaPronto.fecha)}</span>` : ""}
  </header>`;
}
function tarjetaPromo(p, estado){
  const ic = p.tipo === "cumple" ? I.pastel : (estado === "bloqueada" ? I.candado : I.regalo);
  const meta = [];
  if (p.tipo === "cumple") meta.push(`<span class="etq">Tu cumpleaños</span>`);
  else if (p.tipo === "bienvenida") meta.push(`<span class="etq">Bienvenida</span>`);
  else meta.push(`<span class="etq ${p.nivel}">Nivel ${esc(nombreNivel(p.nivel))}</span>`);
  if (p.hasta) meta.push(`<span class="etq">Hasta el ${fechaCorta(new Date(p.hasta + "T12:00:00"))}</span>`);
  if (estado === "bloqueada") meta.push(`<span class="etq">Desbloquéala en ${esc(nombreNivel(p.nivel))}</span>`);
  if (estado === "verificar") meta.push(`<span class="etq">Confirma tu email para usarla</span>`);
  return `<div class="promo ${estado === "bloqueada" || estado === "verificar" ? "bloqueada" : ""}"><span class="ic">${ic}</span>
    <div><b>${esc(p.titulo)}</b>${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ""}<div class="meta">${meta.join("")}</div></div></div>`;
}
function listaPromos(c, incluirBloqueadas){
  const d = [], b = [];
  for (const p of S.promos){
    const e = estadoPromo(p, S.socio, c);
    if (e === "disponible") d.push(tarjetaPromo(p, e));
    else if (e === "verificar") d.push(tarjetaPromo(p, e));
    else if (e === "bloqueada" && incluirBloqueadas) b.push(tarjetaPromo(p, e));
  }
  return {d, b};
}
function vInicio(){
  const c = calcular(S.movs), {d} = listaPromos(c, false);
  return `${cabecera(c)}<div class="bloque">
    ${bannerVerificar()}
    <div class="rejilla">
      <button class="mosaico" type="button" data-ir="tarjeta">${I.qr}<b>Usar mi tarjeta</b></button>
      <button class="mosaico" type="button" data-ir="promos">${I.regalo}<b>Mis promociones</b></button>
      <button class="mosaico" type="button" data-ir="historial">${I.reloj}<b>Mi historial</b></button>
      <button class="mosaico" type="button" data-hoja="como">${I.info}<b>¿Cómo funciona?</b></button>
    </div>
    <div class="seccion-t"><h2 class="titulo">Para ti ahora</h2>${d.length > 2 ? `<button class="enlace" type="button" data-ir="promos">Ver todas</button>` : ""}</div>
    ${d.length ? d.slice(0, 2).join("") : `<div class="vacio">Ahora mismo no tienes promociones activas. ¡Sigue sumando puntos!</div>`}
    <div class="seccion-t"><h2 class="titulo">Niveles</h2></div>
    ${bloqueNiveles(c)}
  </div>`;
}
function bloqueNiveles(c){
  return niveles().map((n, i, arr) => {
    const hasta = arr[i + 1] ? `${n.min} a ${arr[i + 1].min - 1} puntos` : `A partir de ${n.min} puntos`;
    const actual = n.id === c.nivel.id;
    return `<details class="nivel ${actual ? "actual" : ""}" ${actual ? "open" : ""}><summary><span class="bola" style="background:${COLOR[n.id]}"></span>
      <span><b>Nivel ${esc(n.nombre)}${actual ? `<span class="chip-actual">Actual</span>` : ""}</b><small>${hasta}</small></span><span class="flecha">${I.flecha}</span></summary>
      <div class="dentro">${esc(n.beneficios || "")}</div></details>`;
  }).join("");
}
function vPromos(){
  const c = calcular(S.movs), {d, b} = listaPromos(c, true);
  return `${cabeceraSimple("Mis promociones", "Enséñale al camarero la que quieras usar al pagar.")}<div class="bloque">
    ${bannerVerificar()}
    ${d.length ? d.join("") : `<div class="vacio">Ahora mismo no tienes promociones disponibles.</div>`}
    ${b.length ? `<div class="seccion-t"><h2 class="titulo">Sube de nivel y desbloquea</h2></div>${b.join("")}` : ""}
  </div>`;
}
function cabeceraSimple(t, sub){ return `<header class="cab" style="padding-bottom:20px"><h1 class="titulo" style="color:#fff;font-size:28px">${esc(t)}</h1>${sub ? `<p class="saludo" style="margin-top:4px">${esc(sub)}</p>` : ""}</header>`; }

    <div class="num">Nº ${numSocio(S.socio?.numero)}</div>
    <div class="abajo"><span>${esc(S.socio?.nombre || "")}</span><span>${c.puntos.toLocaleString("es-ES")} puntos</span></div>
  </div>
  <p class="brillo">Consejo: sube el brillo de la pantalla para que el código se lea mejor.</p>`;

function vHistorial(){
  const c = calcular(S.movs);
  const items = [];
  for (const m of S.movs){
    if (m.tipo === "suma") items.push({t: ms(m.fecha) || Date.now(), html: mov(I.taza, "Consumo en La Piruleta", `${fecha(m.fecha)}${m.importe ? " · " + euros(m.importe) : ""}`, `+${m.puntos} pts`, "mas")});
    else if (m.tipo === "ajuste") items.push({t: ms(m.fecha) || Date.now(), html: mov(I.info, m.motivo || "Ajuste de puntos", fecha(m.fecha), `${m.puntos > 0 ? "+" : ""}${m.puntos} pts`, m.puntos > 0 ? "mas" : "menos")});
    else if (m.tipo === "canje") items.push({t: ms(m.fecha) || Date.now(), html: mov(I.regalo, "Promoción usada", `${esc(m.promoTitulo || "")} · ${fecha(m.fecha)}`, "", "")});
  }
  for (const m of c.caducados) if (m.tipo === "suma") items.push({t: ms(m.caduca), html: mov(I.info, "Vencimiento de puntos", fecha(m.caduca), `-${m.puntos} pts`, "menos")});
  items.sort((a, b) => b.t - a.t);
  return `${cabeceraSimple("Mi historial", `Tienes ${c.puntos} puntos. Caducan a los ${S.ajustes.caducidadMeses} meses de ganarlos.`)}<div class="bloque">
    ${items.length ? items.map(i => i.html).join("") : `<div class="vacio">Aún no hay movimientos. Enseña tu tarjeta en tu próxima visita.</div>`}
  </div>`;
}
function mov(ic, t, sub, pts, cls){ return `<div class="mov"><span class="ic">${ic}</span><div class="txt"><b>${t}</b><small>${sub}</small></div>${pts ? `<span class="pts ${cls}">${pts}</span>` : ""}</div>`; }

async function borrarCuenta(){

/* ---------- Escanear / buscar socio ---------- */
function lEscanear(){
  const f = S.local.ficha;
  if (f) return fichaSocio(f);
  return `<button class="boton rosa" type="button" id="btnEscanear">${I.qr} Escanear tarjeta</button>
    <p class="centrado nota" style="margin:14px 0">o busca por número de socio o email</p>

    <button class="boton" type="button" id="btnBuscar">Buscar</button>
    <p class="error" id="bsError" role="alert" style="margin-top:10px"></p>
    <div id="resultados"></div>`;
}
let lector = null;
async function cargarScript(src){
  if (document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
}
async function abrirLector(){
  abrirHoja(`<h2>Escanear tarjeta</h2><p class="nota">Apunta al código QR de la tarjeta del socio.</p><div class="lector" id="lector" style="margin-top:12px"></div>
    <div class="botones"><button class="boton peq" type="button" data-cerrar>Cancelar</button></div>`);
  try{
    await cargarScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js");
    lector = new Html5Qrcode("lector");
    await lector.start({facingMode: "environment"}, {fps: 10, qrbox: {width: 230, height: 230}}, async texto => {
      const m = /^PIRU:([A-Za-z0-9]+)$/.exec(texto.trim());
      if (!m){ avisar("Este código no es una tarjeta de La PiruClub"); return; }
      cerrarHoja(); await abrirFicha(m[1]);
    }, () => {});
  }catch(e){ $("#lector").innerHTML = `<div class="vacio" style="color:#fff">No se ha podido abrir la cámara. Revisa los permisos del navegador o busca por número de socio.</div>`; }
}
function pararLector(){ if (lector){ const l = lector; lector = null; l.stop().catch(() => {}).finally(() => { try{ l.clear(); }catch(e){} }); } }
async function buscarSocio(){
  const v = $("#buscar").value.trim(), err = $("#bsError"), res = $("#resultados");
  err.textContent = ""; res.innerHTML = "";
  if (!v) return;
  try{
    const q = v.includes("@") ? query(collection(db, "socios"), where("email", "==", v.toLowerCase()))
                              : query(collection(db, "socios"), where("numero", "==", v.replace(/\D/g, "")));
    let r = await getDocs(q);
    if (r.empty && v.includes("@")) r = await getDocs(query(collection(db, "socios"), where("email", "==", v)));
    if (r.empty){ err.textContent = "No se ha encontrado ningún socio."; return; }
    if (r.size === 1){ await abrirFicha(r.docs[0].id); return; }
    res.innerHTML = r.docs.map(d => `<div class="fila"><div class="txt"><b>${esc(d.data().nombre)}</b><small>${esc(d.data().email)}</small></div><button class="boton peq" type="button" data-ficha="${d.id}">Abrir</button></div>`).join("");
  }catch(e){ err.textContent = textoError(e); }
}
async function abrirFicha(uid){
  try{
    const s = await getDoc(doc(db, "socios", uid));
    if (!s.exists()){ avisar("Ese socio no existe"); return; }
    const m = await getDocs(query(collection(db, "socios", uid, "movimientos"), orderBy("fecha", "desc"), limit(250)));
    S.local.ficha = {id: uid, ...s.data(), movs: m.docs.map(d => ({id: d.id, ...d.data()}))};
    S.local.pestana = "escanear"; S.vista = "local"; pintar(); window.scrollTo(0, 0);
  }catch(e){ avisar(textoError(e)); }
}

  </div>
  <div class="seccion-t"><h2 class="titulo">Sumar puntos</h2></div>
  <div class="importe"><input id="importe" type="text" inputmode="decimal" placeholder="0,00 €" autocomplete="off"></div>
  <p class="vista-pts" id="vistaPts">Escribe el importe del ticket</p>
  <button class="boton rosa" type="button" id="btnSumar">Sumar puntos</button>
  <div class="seccion-t"><h2 class="titulo">Promociones disponibles</h2></div>
  ${promos.length ? promos.map(({p}) => `<div class="fila"><div class="txt"><b>${esc(p.titulo)}</b><small>${esc(p.descripcion || "")}</small></div><button class="boton turquesa peq" type="button" data-canjear="${p.id}">Canjear</button></div>`).join("") : `<div class="vacio">No tiene promociones disponibles ahora.</div>`}
  ${esAdmin() ? `<div class="seccion-t"><h2 class="titulo">Ajuste manual</h2></div>

  ${ult.length ? ult.map(m => mov(m.tipo === "suma" ? I.taza : I.info, m.tipo === "suma" ? euros(m.importe || 0) : esc(m.motivo || "Ajuste"), fecha(m.fecha), `${m.puntos > 0 ? "+" : ""}${m.puntos} pts`, m.puntos >= 0 ? "mas" : "menos")).join("") : `<div class="vacio">Todavía no tiene visitas.</div>`}
  <div class="pila" style="margin:20px 0 10px"><button class="boton" type="button" id="btnOtro">Atender a otro socio</button></div>`;

function leerImporte(){ const v = parseFloat(($("#importe")?.value || "").replace(",", ".")); return isFinite(v) ? v : 0; }
const ptsDe = imp => Math.floor(imp * S.ajustes.puntosPorEuro + 1e-9);
function caducaDesde(){ const d = new Date(); d.setMonth(d.getMonth() + S.ajustes.caducidadMeses); return Timestamp.fromDate(d); }
async function sumarPuntos(){
  const f = S.local.ficha, imp = leerImporte(), pts = ptsDe(imp);
  if (imp <= 0){ avisar("Escribe el importe del ticket"); return; }
  if (imp > 500){ avisar("Importe demasiado alto. Revísalo."); return; }
  const b = $("#btnSumar"); b.disabled = true; b.textContent = "Sumando…";
  try{
    await addDoc(collection(db, "socios", f.id, "movimientos"), {
      tipo: "suma", puntos: pts, importe: Math.round(imp * 100) / 100, fecha: serverTimestamp(), caduca: caducaDesde(),
      por: S.user.uid, porNombre: S.staff.nombre || ""
    });
    const c = calcular(f.movs);
    await updateDoc(doc(db, "socios", f.id), {ultimaVisita: serverTimestamp(), puntosAprox: c.puntos + pts}).catch(() => {});
    avisar(`+${pts} puntos para ${f.nombre}`);
    await abrirFicha(f.id);
  }catch(e){ b.disabled = false; b.textContent = "Sumar puntos"; avisar(textoError(e)); }
}
