<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La PiruClub · Club de socios de La Piruleta</title>
<meta name="description" content="Hazte socio de La Piruleta: suma puntos, sube de nivel y disfruta de promociones exclusivas.">
<meta name="theme-color" content="#124F61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PiruClub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --fondo:#FFFFFF; --suelo:#F4F9FB; --turquesa:#1B7F95; --turquesa-osc:#124F61; --noche:#0E3F4D; --piruleta:#E8507A;
  --tinta:#16343A; --suave:#5E7479; --linea:#E3ECEE; --aviso:#C62828; --ok:#1E8E5A;
  --bronce:#C98A55; --plata:#AEB9C0; --oro:#E2B84A;
  --sobre-turquesa:#FFFFFF; --cab1:#0E3F4D; --cab2:#124F61; --cab3:#1B7F95;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#132C36; --suelo:#10242C; --turquesa:#4FC3D8; --turquesa-osc:#8ED9E6; --noche:#08222B; --piruleta:#FF7FA2;
    --tinta:#E9F4F6; --suave:#AAB9BF; --linea:#27667A; --aviso:#FF9A9A; --ok:#5FD39C;
    --sobre-turquesa:#08222B; --cab1:#08222B; --cab2:#124F61; --cab3:#1F7A90;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#132C36; --suelo:#10242C; --turquesa:#4FC3D8; --turquesa-osc:#8ED9E6; --noche:#08222B; --piruleta:#FF7FA2;
  --tinta:#E9F4F6; --suave:#AAB9BF; --linea:#27667A; --aviso:#FF9A9A; --ok:#5FD39C;
    --sobre-turquesa:#08222B; --cab1:#08222B; --cab2:#124F61; --cab3:#1F7A90;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--suelo);color:var(--tinta);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--noche)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--turquesa-osc)}
:focus-visible{outline:3px solid var(--piruleta);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;background:var(--fondo);min-height:100vh;position:relative}
.con-nav{padding-bottom:96px}
h1,h2,h3{margin:0}
.titulo{font-family:"Baloo 2","Figtree",sans-serif;font-weight:800;color:var(--turquesa-osc);line-height:1.1}
.bloque{padding:18px 18px 0}
.nota{color:var(--suave);font-size:14.5px;margin:4px 0 0}
.centrado{text-align:center}

/* ---------- Botones y formularios ---------- */
.boton{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:999px;border:1.5px solid var(--linea);
  background:var(--fondo);color:var(--tinta);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.boton svg{width:22px;height:22px;flex:none}
.boton.rosa{background:var(--piruleta);border-color:var(--piruleta);color:#fff}
.boton.turquesa{background:var(--turquesa);border-color:var(--turquesa);color:var(--sobre-turquesa)}
.boton.peq{width:auto;padding:9px 15px;font-size:14.5px}
.boton.peligro{color:var(--aviso);border-color:var(--aviso)}
.boton:disabled{opacity:.55;cursor:default}
.enlace{background:none;border:0;padding:0;color:var(--turquesa-osc);font-weight:700;text-decoration:underline;cursor:pointer}
.campo{display:block;margin:0 0 14px}
.campo > span{display:block;font-size:14px;font-weight:700;margin:0 0 5px}
.campo input,.campo select,.campo textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:13px;border:1.5px solid var(--linea);background:var(--suelo);color:var(--tinta)}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--turquesa)}
.campo small{display:block;color:var(--suave);font-size:13px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--turquesa)}
.error{color:var(--aviso);font-weight:700;font-size:14.5px;min-height:20px;margin:0 0 10px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pila{display:grid;gap:10px}

/* ---------- Portada (sin sesión) ---------- */
.toldo{height:84px;position:relative;background:repeating-linear-gradient(90deg,var(--turquesa) 0 28px,#FFFFFF 28px 56px);
  -webkit-mask:radial-gradient(14px at 50% 100%,#0000 98%,#000) 0 0/28px 100%;mask:radial-gradient(14px at 50% 100%,#0000 98%,#000) 0 0/28px 100%}
.toldo::after{content:"";position:absolute;inset:0 0 auto;height:22px;background:linear-gradient(rgba(0,0,0,.18),transparent)}
.portada{text-align:center;padding:0 20px;margin-top:-32px;position:relative}
.logo{width:112px;height:112px;border-radius:50%;margin:0 auto;object-fit:cover;background:#fff;box-shadow:0 0 0 5px var(--fondo),0 8px 24px rgba(18,79,97,.22)}
.portada h1{font-size:36px;margin:12px 0 0}
.ventajas{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px;text-align:left}
.ventajas li{display:flex;gap:12px;align-items:center;font-size:15.5px}
.ventajas .ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--suelo);color:var(--turquesa-osc)}
.ventajas .ic svg{width:22px;height:22px}
.instalar{margin:22px 0 0;padding:16px;border-radius:20px;border:2px dashed var(--turquesa);text-align:left}
.instalar h3{font-size:17px;margin:0 0 6px}
.instalar ol{margin:8px 0 0;padding-left:20px;font-size:15px}
.instalar ol li{margin:4px 0}
.instalar .qr{width:150px;margin:10px auto 0;background:#fff;padding:8px;border-radius:12px}

/* ---------- Cabecera del socio (estilo club) ---------- */
.cab{background:linear-gradient(160deg,var(--cab1),var(--cab2) 55%,var(--cab3));color:#fff;padding:18px 18px 22px;border-radius:0 0 26px 26px;text-align:center;position:relative}
:root[data-theme="dark"] .cab,.cab{--tx:#fff}
.cab .saludo{font-size:15px;opacity:.9;margin:0}
.arco{position:relative;width:250px;max-width:80%;margin:6px auto 0}
.arco svg{width:100%;display:block;overflow:visible}
.medalla{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;padding:5px;
  box-shadow:0 0 0 6px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.35)}
.medalla img{width:100%;height:100%;border-radius:50%;background:#fff;display:block}
.marcas{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin:-8px 4px 0;opacity:.95}
.marcas span small{display:block;font-weight:600;opacity:.75}
.cifras{display:flex;justify-content:center;gap:0;margin:12px 0 0}
.cifras div{padding:0 18px}
.cifras div + div{border-left:1.5px solid rgba(255,255,255,.35)}
.cifras small{display:block;font-size:13px;opacity:.85}
.cifras b{font-family:"Baloo 2","Figtree",sans-serif;font-size:34px;line-height:1}
.siguiente{margin:10px 0 0;font-size:14px;opacity:.95}
.caduca{display:inline-block;margin:10px 0 0;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.15);font-size:13px;font-weight:600}

.verificar{margin:0 0 14px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--piruleta) 10%,var(--fondo));border:1.5px solid color-mix(in srgb,var(--piruleta) 40%,var(--fondo))}
.verificar b{color:var(--tinta)}
.verificar p{margin:4px 0 0;font-size:14.5px;color:var(--suave)}

/* ---------- Tarjetas de acceso rápido ---------- */
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mosaico{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;border:1.5px solid var(--linea);background:var(--fondo);cursor:pointer;text-align:left;min-height:110px}
.mosaico svg{width:28px;height:28px;color:var(--turquesa)}
.mosaico b{font-size:16px;line-height:1.25}
.seccion-t{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.seccion-t h2{font-size:21px}

/* ---------- Promociones ---------- */
.promo{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:1.5px solid var(--linea);background:var(--fondo);margin:0 0 10px}
.promo .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--piruleta) 14%,var(--fondo));color:var(--piruleta)}
.promo .ic svg{width:24px;height:24px}
.promo b{display:block;font-size:16px;line-height:1.25}
.promo p{margin:3px 0 0;color:var(--suave);font-size:14.5px}
.promo .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.etq{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--suelo);color:var(--suave)}
.etq.bronce{background:color-mix(in srgb,var(--bronce) 25%,var(--fondo));color:#7A4A22}
.etq.plata{background:color-mix(in srgb,var(--plata) 35%,var(--fondo));color:#4A5860}
.etq.oro{background:color-mix(in srgb,var(--oro) 30%,var(--fondo));color:#7A5A0A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .etq.bronce{color:#F0C49A}
  :root:not([data-theme="light"]) .etq.plata{color:#DCE4E8}
  :root:not([data-theme="light"]) .etq.oro{color:#F6DE8E}
}
:root[data-theme="dark"] .etq.bronce{color:#F0C49A}
:root[data-theme="dark"] .etq.plata{color:#DCE4E8}
:root[data-theme="dark"] .etq.oro{color:#F6DE8E}
.promo.bloqueada{opacity:.6}
.promo.bloqueada .ic{background:var(--suelo);color:var(--suave)}
.promo .derecha{margin-left:auto;flex:none}
.vacio{padding:24px 16px;text-align:center;color:var(--suave);border:1.5px dashed var(--linea);border-radius:18px}

/* ---------- Niveles ---------- */
.nivel{border:1.5px solid var(--linea);border-radius:18px;margin:0 0 10px;overflow:hidden}
.nivel summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.nivel summary::-webkit-details-marker{display:none}
.nivel .bola{width:34px;height:34px;border-radius:50%;flex:none}
.nivel summary b{display:block}
.nivel summary small{color:var(--suave)}
.nivel .flecha{margin-left:auto;transition:transform .2s}
.nivel[open] .flecha{transform:rotate(180deg)}
.nivel .dentro{padding:0 14px 14px 60px;color:var(--suave);font-size:14.5px;white-space:pre-line}
.nivel.actual{border-color:var(--turquesa)}
.chip-actual{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--turquesa);color:var(--sobre-turquesa);font-size:11.5px;font-weight:800;vertical-align:2px}

/* ---------- Historial ---------- */
.mov{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:0}
.mov .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--suelo);color:var(--turquesa)}
.mov .ic svg{width:20px;height:20px}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-size:15.5px;font-weight:700}
.mov .txt small{color:var(--suave)}
.mov .pts{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .pts.mas{color:var(--ok)}
.mov .pts.menos{color:var(--suave)}

/* ---------- Tarjeta de socio ---------- */
.carnet{margin:18px;border-radius:24px;padding:18px;color:#3A2A08;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.carnet.bronce{background:linear-gradient(135deg,#E9B88A,#C98A55);color:#3B220C}
.carnet.plata{background:linear-gradient(135deg,#E7EDF0,#AEB9C0);color:#26333A}
.carnet.oro{background:linear-gradient(135deg,#F6DE8E,#E2B84A);color:#3A2A08}
.carnet .arriba{display:flex;justify-content:space-between;align-items:center}
.carnet .marca{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;line-height:1}
.carnet .marca small{display:block;font-family:"Figtree",sans-serif;font-size:13px;font-weight:700;opacity:.8}
.carnet .minilogo{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover}
.carnet .qr{background:#fff;border-radius:18px;padding:14px;margin:16px auto 0;max-width:270px}
.carnet .qr svg{width:100%;height:auto;display:block}
.carnet .num{text-align:center;font-weight:800;font-size:18px;letter-spacing:.06em;margin:12px 0 0;font-variant-numeric:tabular-nums}
.carnet .abajo{display:flex;justify-content:space-between;margin-top:12px;font-size:14px;font-weight:700}
.brillo{font-size:13.5px;color:var(--suave);text-align:center;margin:0 18px}

/* ---------- Barra inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none}
.nav .dentro{pointer-events:auto;max-width:520px;margin:0 auto;background:var(--fondo);border-top:1px solid var(--linea);display:flex;justify-content:space-around;align-items:flex-end;
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--suave);cursor:pointer;padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button.activo{color:var(--turquesa-osc)}
.nav button.central .bola{width:60px;height:60px;border-radius:50%;background:var(--piruleta);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(232,80,122,.45)}
.nav button.central .bola svg{width:28px;height:28px}

/* ---------- Panel del local ---------- */
.pestanas{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--linea);background:var(--fondo);font-weight:700;font-size:14.5px;cursor:pointer;color:var(--suave)}
.pestanas button.activo{background:var(--tinta);border-color:var(--tinta);color:var(--fondo)}
.lector{border-radius:18px;overflow:hidden;background:#000;min-height:260px}
.ficha{border:1.5px solid var(--linea);border-radius:20px;padding:16px}
.ficha .quien{display:flex;gap:12px;align-items:center}
.ficha .bola{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px}
.ficha h3{font-size:19px}
.ficha .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0;text-align:center}
.ficha .datos div{background:var(--suelo);border-radius:12px;padding:8px 4px}
.ficha .datos b{display:block;font-size:18px}
.ficha .datos small{color:var(--suave);font-size:12.5px}
.aviso-cumple{margin:12px 0 0;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--piruleta) 14%,var(--fondo));color:var(--piruleta);font-weight:700;font-size:14.5px}
.importe{display:flex;gap:8px;align-items:stretch}
.importe input{flex:1;min-width:0;font:inherit;font-size:26px;font-weight:800;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--linea);background:var(--suelo);color:var(--tinta)}
.importe input:focus{outline:none;border-color:var(--turquesa)}
.vista-pts{text-align:center;color:var(--suave);font-size:14.5px;margin:8px 0 12px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .txt{min-width:0}
.fila .txt b{display:block}
.fila .txt small{color:var(--suave)}
.cifra-grande{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:30px;color:var(--turquesa-osc);line-height:1}

.resultado{width:64px;height:64px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;font-size:32px;font-weight:800;color:#fff}
.resultado.ok{background:var(--ok)}
.resultado.mal{background:var(--aviso)}

/* ---------- Pantalla de bienvenida animada ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(circle at 50% 42%,#1B7F95 0%,#124F61 45%,#0E3F4D 100%);transition:opacity .45s ease,transform .45s ease}
#splash.fuera{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-centro{position:relative;width:170px;height:170px}
.sp-logo{position:relative;width:170px;height:170px;border-radius:50%;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.35);
  animation:spEntra .9s cubic-bezier(.2,1.4,.4,1) both, spGiro 2.6s ease-in-out .9s infinite}
.sp-halo{position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(255,255,255,.55);animation:spHalo 1.6s ease-out .5s infinite;opacity:0}
.sp-nombre{font-family:"Baloo 2","Figtree",system-ui,sans-serif;font-weight:800;font-size:34px;color:#fff;letter-spacing:.01em;
  animation:spSube .7s ease-out .45s both}
.sp-puntos{display:flex;gap:8px;animation:spSube .5s ease-out .8s both}
.sp-puntos i{width:9px;height:9px;border-radius:50%;background:#E8507A;animation:spPunto 1s ease-in-out infinite}
.sp-puntos i:nth-child(2){animation-delay:.15s;background:#fff}
.sp-puntos i:nth-child(3){animation-delay:.3s;background:#7FE3F2}
@keyframes spEntra{0%{transform:scale(.2) rotate(-200deg);opacity:0}70%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spGiro{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.03)}75%{transform:rotate(7deg) scale(1.03)}}
@keyframes spHalo{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes spSube{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes spPunto{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-7px);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .sp-logo{animation:spSube .4s ease-out both}.sp-halo{display:none}.sp-nombre,.sp-puntos{animation:none}.sp-puntos i{animation:none}
}

/* ---------- Capas ---------- */
.velo{position:fixed;inset:0;background:rgba(6,25,30,.55);z-index:50;display:none}
.velo.ver{display:block}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--fondo);border-radius:24px 24px 0 0;max-width:520px;margin:0 auto;
  padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-height:90vh;overflow:auto}
.hoja.ver{transform:none}
.hoja h2{font-size:20px;margin:0 0 6px}
.hoja .texto-legal{font-size:14px;color:var(--suave)}
.hoja .texto-legal h3{font-size:15px;color:var(--tinta);margin:14px 0 4px}
.hoja .texto-legal p{margin:0 0 6px}
.botones{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#aviso{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--fondo);
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .15s;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#aviso.ver{opacity:1}
.cargando{display:grid;place-items:center;min-height:70vh;color:var(--suave)}
.giro{width:38px;height:38px;border-radius:50%;border:4px solid var(--linea);border-top-color:var(--turquesa);animation:giro .8s linear infinite;margin:0 auto 12px}

<script>
/* Diagnóstico: si la app no consigue arrancar, mostrar el motivo en vez de quedarse girando */
window.__arranco = false; window.__errores = [];
window.addEventListener("error", function(e){ window.__errores.push((e.message || "Error") + (e.filename ? " [" + e.filename.split("/").pop() + ":" + (e.lineno || "") + "]" : "")); if (!window.__arranco) setTimeout(mostrarFallo, 300); }, true);
window.addEventListener("unhandledrejection", function(e){ window.__errores.push("Promesa: " + ((e.reason && (e.reason.code || e.reason.message)) || e.reason)); });
function mostrarFallo(){
  if (window.__arranco) return;
  var a = document.getElementById("app"); if (!a || !a.querySelector(".cargando")) return;
  var sp = document.getElementById("splash"); if (sp) sp.remove();
  var det = window.__errores.length ? window.__errores.join("<br>") : "Sin errores registrados (la conexión con Firebase no responde).";
  a.innerHTML = '<div style="padding:40px 22px;text-align:center;font-family:system-ui,sans-serif"><h2 style="color:#124F61">No se ha podido abrir La PiruClub</h2>'
    + '<p style="color:#5E7479">Haz una captura de esta pantalla y envíasela a quien te ayuda con la app.</p>'
    + '<p style="font-family:monospace;font-size:12px;text-align:left;background:#f3f8f9;color:#16343A;padding:10px;border-radius:10px;word-break:break-word">' + det.replace(/</g,"&lt;").replace(/&lt;br>/g,"<br>") + '<br>Navegador: ' + navigator.userAgent.replace(/</g,"") + '</p>'
    + '<button onclick="location.reload()" style="padding:12px 22px;border-radius:999px;border:0;background:#1B7F95;color:#fff;font-weight:700;font-size:16px">Reintentar</button></div>';
}
setTimeout(mostrarFallo, 20000);
</script>

const meses = n => n === 1 ? "1 mes" : n + " meses";
/* ---------------------------- Cálculos ---------------------------- */
// Devuelve {inicio, fin, dia} (fechas en milisegundos UTC) si hoy está en la semana del cumpleaños; si no, null
function semanaCumple(nacimiento){
  if (!nacimiento || !/^\d{4}-\d{2}-\d{2}$/.test(nacimiento)) return null;
  const [y, m, d] = hoyISO().split("-").map(Number), hoy = Date.UTC(y, m - 1, d);
  const mes = +nacimiento.slice(5, 7), dia = +nacimiento.slice(8, 10);
  for (const anio of [y - 1, y, y + 1]){
    let fd = dia;
    if (mes === 2 && dia === 29 && !((anio % 4 === 0 && anio % 100 !== 0) || anio % 400 === 0)) fd = 28;
    const c = Date.UTC(anio, mes - 1, fd);
    const inicio = c - CUMPLE_DIAS_ANTES * DIA, fin = c + CUMPLE_DIAS_DESPUES * DIA;
    if (hoy >= inicio && hoy <= fin) return {inicio, fin, dia: c};
  }
  return null;
}
const fechaUTC = t => new Date(t).toLocaleDateString("es-ES", {day: "numeric", month: "long", timeZone: "UTC"});
function niveles(){ return [...S.ajustes.niveles].sort((a, b) => a.min - b.min); }
function calcular(movs){
  const ahora = Date.now();
  let puntos = 0; const vivos = [], caducados = [];
  for (const m of movs){
    if (m.tipo === "suma" || m.tipo === "ajuste"){
      if (ms(m.caduca) > ahora){ puntos += m.puntos || 0; vivos.push(m); }
      else caducados.push(m);
    }
  }
  puntos = Math.max(0, puntos);
  const ns = niveles();
  let nivel = ns[0];
  for (const n of ns) if (puntos >= n.min) nivel = n;
  const siguiente = ns.find(n => n.min > puntos) || null;
  const pronto = vivos.filter(m => m.tipo === "suma" && ms(m.caduca) - ahora < 7 * DIA).sort((a, b) => ms(a.caduca) - ms(b.caduca));
  const caducaPronto = pronto.length ? {puntos: pronto.reduce((s, m) => s + m.puntos, 0), fecha: pronto[0].caduca} : null;
  const canjes = movs.filter(m => m.tipo === "canje");
  return {puntos, nivel, siguiente, caducados, canjes, caducaPronto};
}
function estadoPromo(p, socio, calc){
  if (!p.activa) return "oculta";
  const hoy = hoyISO();
  if (p.desde && hoy < p.desde) return "oculta";
  if (p.hasta && hoy > p.hasta) return "oculta";
  const usadas = calc.canjes.filter(c => c.promoId === p.id);
  if (p.tipo === "cumple"){
    const sc = semanaCumple(socio?.nacimiento);
    if (!sc) return "oculta";
    if (usadas.some(c => Math.abs((ms(c.fecha) || Date.now()) - sc.dia) < 60 * DIA)) return "usada";
  } else if (p.tipo === "bienvenida"){
    if (usadas.length) return "usada";
    if (Date.now() - (ms(socio?.alta) || Date.now()) > 30 * DIA) return "oculta";
    if (socio?.emailVerificado !== true && !(socio?.id && socio.id === S.user?.uid && auth.currentUser?.emailVerified)) return "verificar";
  } else if (p.usos !== "ilimitada" && usadas.length) return "usada";
  if ((ORDEN[p.nivel] ?? 0) > (ORDEN[calc.nivel.id] ?? 0)) return "bloqueada";
  return "disponible";
}

function cabecera(c){
  const ns = niveles(), p = c.puntos;
  // El arco va de Bronce (izquierda) a Plata (arriba) y a Oro (derecha)
  const prog = p >= ns[2].min ? 1 : p >= ns[1].min ? 0.5 + 0.5 * (p - ns[1].min) / (ns[2].min - ns[1].min) : 0.5 * p / Math.max(1, ns[1].min);
  const L = 251.3; // longitud del arco
  return `<header class="cab">
    <p class="saludo">Hola, ${esc(S.socio?.nombre || "socio")}</p>
    <div class="arco">
      <svg viewBox="0 0 200 120" aria-hidden="true">
        <path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12" stroke-linecap="round"/>
        <path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="#7FE3F2" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(L * prog).toFixed(1)} ${L}"/>
      </svg>

function tarjetaPromo(p, estado){

  if (p.hasta) meta.push(`<span class="etq">Hasta el ${fechaCorta(new Date(p.hasta + "T12:00:00"))}</span>`);
  if (estado === "bloqueada") meta.push(`<span class="etq">Desbloquéala en ${esc(nombreNivel(p.nivel))}</span>`);
  if (estado === "verificar") meta.push(`<span class="etq">Confirma tu email para usarla</span>`);

let lector = null;
async function cargarScript(src){
  if (document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
}
// Formato del QR del ticket de TPV Factu:  PTK1;<número de ticket>;<total con 2 decimales>;<AAAA-MM-DD>;<HH:MM>
function leerTicketQR(texto){
  const p = String(texto || "").trim().split(";");
  if (p[0] !== "PTK1" || p.length < 5) return null;
  const numero = p[1].trim(), total = parseFloat(p[2].replace(",", ".")), fechaT = p[3].trim(), hora = (p[4] || "").trim();
  if (!numero || !isFinite(total) || !/^\d{4}-\d{2}-\d{2}$/.test(fechaT)) return null;
  return {numero, total: Math.round(total * 100) / 100, fecha: fechaT, hora};
}
const idTicket = n => String(n).replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 120);
let tLeido = 0;
async function abrirLector(modo = "tarjeta"){
  tLeido = 0; let procesando = false;
  const titulos = {tarjeta: ["Escanear tarjeta", "Apunta al código QR de la tarjeta del socio."],
                   ticket: ["Escanear ticket", "Apunta al código QR que hay al final del ticket."],
                   comprobar: ["Comprobar ticket", "Apunta al código QR del ticket que quieres comprobar."]};
  abrirHoja(`<h2>${titulos[modo][0]}</h2><p class="nota">${titulos[modo][1]}</p><div class="lector" id="lector" style="margin-top:12px"></div>
    <div class="botones"><button class="boton peq" type="button" data-cerrar>Cancelar</button></div>`);
  try{
    await cargarScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js");
    lector = new Html5Qrcode("lector");
    await lector.start({facingMode: "environment"}, {fps: 10, qrbox: {width: 230, height: 230}}, async texto => {
      if (procesando || Date.now() - tLeido < 1500) return;
      tLeido = Date.now();
      const tarjeta = /^PIRU:([A-Za-z0-9]+)$/.exec(texto.trim());
      const ticket = leerTicketQR(texto);
      if (modo === "tarjeta"){
        if (ticket){ avisar("Primero escanea la tarjeta del socio"); return; }
        if (!tarjeta){ avisar("Este código no es una tarjeta de La PiruClub"); return; }
        procesando = true; cerrarHoja(); await abrirFicha(tarjeta[1]); return;
      }
      if (!ticket){ avisar(tarjeta ? "Eso es una tarjeta de socio. Escanea el QR del ticket" : "Este código no es un ticket de TPV Factu"); return; }
      procesando = true; cerrarHoja();
      if (modo === "ticket") await sumarTicket(ticket); else await comprobarTicket(ticket.numero, ticket);
    }, () => {});
  }catch(e){ $("#lector").innerHTML = `<div class="vacio" style="color:#fff">No se ha podido abrir la cámara. Revisa los permisos del navegador.</div>`; }
}

/* ---------- Sumar puntos con el QR del ticket ---------- */
async function sumarTicket(tk){
  const f = S.local.ficha;
  if (!f){ avisar("Primero escanea la tarjeta del socio"); return; }
  if (tk.fecha !== hoyISO()){ hojaResultado("No se puede usar", `Este ticket es del <b>${fechaUTC(Date.parse(tk.fecha + "T00:00:00Z"))}</b>. Solo se pueden sumar puntos de tickets de <b>hoy</b>.`, false); return; }
  if (!(tk.total > 0) || tk.total > 500){ hojaResultado("Importe no válido", `El ticket indica ${euros(tk.total)}. Revisa el ticket o suma los puntos a mano.`, false); return; }
  const id = idTicket(tk.numero);
  try{
    const ya = await getDoc(doc(db, "tickets", id));
    if (ya.exists()){
      const d = ya.data();
      hojaResultado("Ticket ya usado", d.estado === "anulado" || d.estado === "parcial"
        ? `El ticket <b>${esc(tk.numero)}</b> ya se usó y tiene ${d.estado === "anulado" ? "una devolución completa" : "una devolución parcial"}. No se puede volver a usar.`
        : `El ticket <b>${esc(tk.numero)}</b> ya sumó <b>${d.puntos} puntos</b> a <b>${esc(d.socioNombre)}</b> el ${fecha(d.escaneado)}.`, false);
      return;
    }
    const pts = ptsDe(tk.total), caduca = caducaDesde();
    const lote = writeBatch(db);
    lote.set(doc(db, "tickets", id), {numero: tk.numero, total: tk.total, fechaTicket: tk.fecha, hora: tk.hora, puntos: pts,
      socioId: f.id, socioNombre: f.nombre || "", movId: "tk_" + id, estado: "usado", escaneado: serverTimestamp(), por: S.user.uid, porNombre: S.staff.nombre || ""});
    lote.set(doc(db, "socios", f.id, "movimientos", "tk_" + id), {tipo: "suma", puntos: pts, importe: tk.total, ticket: tk.numero,
      fecha: serverTimestamp(), caduca, por: S.user.uid, porNombre: S.staff.nombre || ""});
    await lote.commit();

// Estado de devolución de un ticket (compatible con tickets antiguos sin estos campos)
function restoTicket(d){
  const devuelto = Math.round((d.devuelto || 0) * 100) / 100;
  const ptsDev = d.puntosDevueltos || 0;
  return {devuelto, ptsDev, queda: Math.max(0, Math.round((d.total - devuelto) * 100) / 100), ptsQuedan: Math.max(0, d.puntos - ptsDev)};
}
// Puntos que se restan al devolver «importe»: misma proporción con la que se sumaron; si se devuelve todo lo que queda, se restan todos los que quedan
function ptsADevolver(d, importe){
  const r = restoTicket(d);
  if (importe >= r.queda - 0.004) return r.ptsQuedan;
  return Math.min(r.ptsQuedan, Math.floor(importe * (d.puntos / d.total) + 1e-9));
}
async function comprobarTicket(numero){

    const d = s.data(), r = restoTicket(d);
    if (d.estado === "anulado"){ hojaResultado("Ya anulado", `Los puntos del ticket <b>${esc(numero)}</b> ya se anularon por completo el ${fecha(d.anuladoEn)}${d.anuladoPorNombre ? " (" + esc(d.anuladoPorNombre) + ")" : ""}.`, true); return; }

    abrirHoja(`<h2>Este ticket sumó puntos</h2>

// Resta puntos de un ticket. importe = null → todo lo que queda
async function devolverTicket(id, importe){
  const boton = $(importe == null ? "#btnAnular" : "#btnConfParcial"), err = $("#anError");
  try{
    const s = await getDoc(doc(db, "tickets", id)); if (!s.exists()) return;
    const d = s.data(), r = restoTicket(d);
    if (d.estado === "anulado" || r.queda <= 0){ hojaResultado("Ya anulado", "Este ticket ya no tiene nada que devolver.", true); return; }
    const imp = importe == null ? r.queda : Math.round(importe * 100) / 100;
    if (!(imp > 0)){ if (err) err.textContent = "Escribe el importe devuelto."; return; }
    if (imp > r.queda + 0.004){ if (err) err.textContent = `No puede ser más de ${euros(r.queda)}.`; return; }
    if (boton){ boton.disabled = true; boton.textContent = "Restando…"; }
    const pts = ptsADevolver(d, imp);
    const nuevoDevuelto = Math.round((r.devuelto + imp) * 100) / 100, completo = nuevoDevuelto >= d.total - 0.004;
    const orig = await getDoc(doc(db, "socios", d.socioId, "movimientos", d.movId));
    // Lo que se resta caduca a la vez que los puntos del ticket, para no restar dos veces
    const caduca = orig.exists() && orig.data().caduca ? orig.data().caduca : caducaDesde();
    const n = (d.devoluciones || 0) + 1;
    const lote = writeBatch(db);
    const cambios = {devuelto: nuevoDevuelto, puntosDevueltos: r.ptsDev + pts, devoluciones: n, estado: completo ? "anulado" : "parcial",
      ultimaDevolucion: serverTimestamp(), ultimaDevolucionPor: S.staff.nombre || ""};
    if (completo) Object.assign(cambios, {anuladoEn: serverTimestamp(), anuladoPor: S.user.uid, anuladoPorNombre: S.staff.nombre || ""});
    lote.update(doc(db, "tickets", id), cambios);
    if (pts > 0) lote.set(doc(db, "socios", d.socioId, "movimientos", `dv_${id}_${n}`), {tipo: "ajuste", puntos: -pts,
      motivo: (completo ? (r.devuelto === 0 ? "Devolución del ticket " : "Devolución del resto del ticket ") : "Devolución parcial del ticket ") + d.numero + " (" + euros(imp) + ")",
      ticket: d.numero, fecha: serverTimestamp(), caduca, por: S.user.uid, porNombre: S.staff.nombre || ""});
    await lote.commit();
    S.ticketAbierto = null;
    hojaResultado(completo ? "Ticket anulado" : "Devolución parcial hecha",
      `Se ${pts === 1 ? "ha" : "han"} restado <b>${pts} punto${pts === 1 ? "" : "s"}</b> a <b>${esc(d.socioNombre)}</b> por ${euros(imp)}.<br>` +
      (completo ? `El ticket <b>${esc(d.numero)}</b> queda anulado por completo.` : `Del ticket <b>${esc(d.numero)}</b> quedan ${euros(d.total - nuevoDevuelto)} y ${d.puntos - r.ptsDev - pts} puntos.`), true);
    if (S.local.ficha?.id === d.socioId) abrirFicha(d.socioId);
  }catch(e){ if (boton){ boton.disabled = false; boton.textContent = importe == null ? "Anular" : "Restar puntos"; } if (err) err.textContent = textoError(e); }
}

  };
  if (id) $("#btnBorrarPromo").onclick = async () => {
    if (!confirm("¿Borrar esta promoción? Si solo quieres ocultarla, desmarca «Activa».")) return;
    try{ await deleteDoc(doc(db, "promos", id)); cerrarHoja(); avisar("Promoción borrada"); }catch(e){ $("#pError").textContent = textoError(e); }
  };
}

/* ---------- Socios (admin) ---------- */
let SOCIOS = null;
function lSocios(){
  return `<div class="ficha" style="text-align:center"><div class="cifra-grande" id="totalSocios">…</div><small class="nota">socios registrados</small></div>
    <div class="importe" style="margin:14px 0 8px"><input id="filtroSocios" style="font-size:17px" placeholder="Buscar por nombre o email"></div>
    <button class="boton" type="button" id="btnExportar">Descargar copia (Excel / CSV)</button>
    <div id="listaSocios" style="margin-top:10px"></div>`;
}
async function cargarSocios(){
  try{
    if (!SOCIOS){
      const r = await getDocs(query(collection(db, "socios"), orderBy("alta", "desc"), limit(2000)));
      SOCIOS = r.docs.map(d => ({id: d.id, ...d.data()}));
    }
    if (S.local.pestana !== "socios" || !$("#totalSocios")) return;
    $("#totalSocios").textContent = SOCIOS.length;
    pintarListaSocios();
  }catch(e){ const l = $("#listaSocios"); if (l) l.innerHTML = `<p class="error">${textoError(e)}</p>`; }
}
function pintarListaSocios(){
  const f = ($("#filtroSocios")?.value || "").toLowerCase();
  const l = SOCIOS.filter(s => !f || (s.nombre || "").toLowerCase().includes(f) || (s.email || "").toLowerCase().includes(f)).slice(0, 100);
  $("#listaSocios").innerHTML = l.map(s => `<div class="fila"><div class="txt"><b>${esc(s.nombre)}</b><small>${esc(s.email)} · alta ${fecha(s.alta)}${s.ultimaVisita ? " · última visita " + fecha(s.ultimaVisita) : ""}</small></div>
    <button class="boton peq" type="button" data-ficha="${s.id}">Ver</button></div>`).join("") || `<div class="vacio">Sin resultados.</div>`;
}
function exportar(){
  if (!SOCIOS) return;
  const cab = ["Número", "Nombre", "Email", "Nacimiento", "Alta", "Última visita", "Puntos aprox.", "Acepta emails"];
  const c = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const fl = SOCIOS.map(s => [s.numero, s.nombre, s.email, s.nacimiento, fecha(s.alta), s.ultimaVisita ? fecha(s.ultimaVisita) : "", s.puntosAprox ?? "", s.marketing ? "Sí" : "No"].map(c).join(";"));
  const blob = new Blob(["\ufeff" + [cab.map(c).join(";"), ...fl].join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `socios-piruclub-${hoyISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Ajustes (admin) ---------- */
function lAjustes(){
  const a = S.ajustes, ns = niveles();
  return `<div class="dos">
      <label class="campo"><span>Puntos por euro</span><input id="aPPE" type="number" step="0.5" min="0.5" value="${a.puntosPorEuro}"></label>
      <label class="campo"><span>Caducidad (meses)</span><input id="aCad" type="number" min="1" max="36" value="${a.caducidadMeses}"></label>
    </div>
    ${ns.map((n, i) => `<div class="ficha" style="margin-bottom:10px">
      <div class="dos"><label class="campo"><span>Nombre del nivel</span><input id="aN${i}" value="${esc(n.nombre)}"></label>
      <label class="campo"><span>Desde (puntos)</span><input id="aM${i}" type="number" min="0" value="${n.min}" ${i === 0 ? "disabled" : ""}></label></div>
      <label class="campo" style="margin:0"><span>Beneficios (los ven los socios)</span><textarea id="aB${i}">${esc(n.beneficios || "")}</textarea></label></div>`).join("")}
    <p class="error" id="aError" role="alert"></p>
    <button class="boton rosa" type="button" id="btnGuardarAjustes">Guardar ajustes</button>
    <p class="nota" style="margin:12px 0 0">Los cambios de puntos por euro y caducidad se aplican a las visitas nuevas.</p>
    <p class="nota" style="margin:18px 0 0;text-align:center">La PiruClub · versión ${VERSION_APP}</p>`;
}
async function guardarAjustes(){
  const ns = niveles(), err = $("#aError");
  const nuevos = ns.map((n, i) => ({id: n.id, nombre: $("#aN" + i).value.trim() || n.nombre, min: i === 0 ? 0 : parseInt($("#aM" + i).value, 10) || 0, beneficios: $("#aB" + i).value.trim()}));
  if (!(nuevos[1].min > 0 && nuevos[2].min > nuevos[1].min)){ err.textContent = "Cada nivel debe empezar en más puntos que el anterior."; return; }
  const ppe = parseFloat($("#aPPE").value), cad = parseInt($("#aCad").value, 10);
  if (!(ppe > 0) || !(cad >= 1)){ err.textContent = "Revisa los puntos por euro y la caducidad."; return; }
  try{ await setDoc(doc(db, "config", "ajustes"), {puntosPorEuro: ppe, caducidadMeses: cad, niveles: nuevos}); avisar("Ajustes guardados"); }
  catch(e){ err.textContent = textoError(e); }
}

/* ---------- Equipo (admin) ---------- */
function lEquipo(){
  return `<p class="nota" style="margin:0 0 12px">Para añadir a un empleado: que se registre primero como socio en la app y te diga su número de socio.</p>
    <div class="importe" style="margin-bottom:8px"><input id="eqNum" style="font-size:18px" inputmode="numeric" placeholder="Número de socio"></div>
    <button class="boton rosa" type="button" id="btnAddEquipo">Añadir como empleado</button>
    <p class="error" id="eqError" role="alert" style="margin-top:10px"></p>
    <div id="listaEquipo"></div>`;
}
async function cargarEquipo(){
  try{
    const r = await getDocs(collection(db, "staff"));
    const l = $("#listaEquipo"); if (!l) return;
    l.innerHTML = r.docs.map(d => { const x = d.data(); return `<div class="fila"><div class="txt"><b>${esc(x.nombre || "Sin nombre")}</b><small>${x.rol === "admin" ? "Administrador" : "Empleado"}</small></div>
      ${d.id !== S.user.uid && x.rol !== "admin" ? `<button class="boton peligro peq" type="button" data-quitar="${d.id}">Quitar</button>` : ""}</div>`; }).join("");
  }catch(e){ const l = $("#listaEquipo"); if (l) l.innerHTML = `<p class="error">${textoError(e)}</p>`; }
}
async function anadirEquipo(){
  const n = $("#eqNum").value.replace(/\D/g, ""), err = $("#eqError"); err.textContent = "";
  if (!n) return;
  try{
    const r = await getDocs(query(collection(db, "socios"), where("numero", "==", n)));
    if (r.empty){ err.textContent = "No hay ningún socio con ese número."; return; }
    const s = r.docs[0];
    await setDoc(doc(db, "staff", s.id), {rol: "empleado", nombre: s.data().nombre || ""});
    $("#eqNum").value = ""; avisar(`${s.data().nombre} ya es empleado`); cargarEquipo();
  }catch(e){ err.textContent = textoError(e); }
}

/* ------------------------- Eventos globales ------------------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.ir !== undefined){ ir(d.ir); return; }
  if (d.legal){ hojaLegal(d.legal); return; }
  if (d.cerrar !== undefined){ cerrarHoja(); return; }
  if (d.hoja === "como"){ hojaComo(); return; }
  if (d.hoja === "nombre"){ hojaNombre(); return; }
  if (d.hoja === "borrar"){ hojaBorrar(); return; }
  if (d.pestana){ S.local.pestana = d.pestana; S.local.ficha = null; if (d.pestana === "socios") SOCIOS = null; pintar(); return; }
  if (d.ficha){ abrirFicha(d.ficha); return; }
  if (d.canjear){ canjear(d.canjear); return; }
  if (d.editarPromo !== undefined){ editarPromo(d.editarPromo); return; }
  if (d.quitar){ if (confirm("¿Quitar a esta persona del equipo?")) deleteDoc(doc(db, "staff", d.quitar)).then(() => { avisar("Quitado del equipo"); cargarEquipo(); }).catch(er => avisar(textoError(er))); return; }
  switch (t.id){
    case "btnRegistro": registrar(); break;
    case "btnCompletar": completar(); break;
    case "btnEntrar": entrar(); break;
    case "btnOlvido": olvido(); break;
    case "btnSalir": signOut(auth); break;
    case "btnBorrar": borrarCuenta(); break;
    case "btnYaVerifique": comprobarVerificacion(true); break;
    case "btnReenviar":
      if (auth.currentUser) enviarVerificacion(auth.currentUser).then(() => avisar("Te hemos enviado el email. Revisa tu correo")).catch(er => avisar(er?.code === "auth/too-many-requests" ? "Ya te lo enviamos hace poco. Espera unos minutos" : textoError(er)));
      break;
    case "btnGuardarNombre": {
      const n = $("#nNombre").value.trim(); if (!n) return;
      updateDoc(doc(db, "socios", S.user.uid), {nombre: n}).then(() => { cerrarHoja(); avisar("Nombre cambiado"); }).catch(er => avisar(textoError(er))); break;
    }
    case "btnEscanear": abrirLector("tarjeta"); break;
    case "btnTicket": abrirLector("ticket"); break;
    case "btnComprobar": hojaComprobar(); break;
    case "btnLeerComprobar": abrirLector("comprobar"); break;
    case "btnBuscarTicket": { const n = $("#numTicket").value.trim(); if (!n){ $("#ctError").textContent = "Escribe el número del ticket."; break; } comprobarTicket(n); break; }
    case "btnAnular": devolverTicket(t.dataset.ticket, null); break;
    case "btnParcial": formParcial(t.dataset.ticket); break;
    case "btnConfParcial": devolverTicket(t.dataset.ticket, parseFloat(($("#impParcial").value || "").replace(",", "."))); break;
    case "btnBuscar": buscarSocio(); break;
    case "btnSumar": sumarPuntos(); break;
    case "btnAjuste": ajusteManual(); break;
    case "btnOtro": S.local.ficha = null; pintar(); break;
    case "btnExportar": exportar(); break;
    case "btnGuardarAjustes": guardarAjustes(); break;
    case "btnAddEquipo": anadirEquipo(); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "pMarketing") updateDoc(doc(db, "socios", S.user.uid), {marketing: e.target.checked}).then(() => avisar("Preferencia guardada")).catch(er => avisar(textoError(er)));
});
document.addEventListener("input", e => {
  if (e.target.id === "importe"){ const imp = leerImporte(); $("#vistaPts").textContent = imp > 0 ? `${euros(imp)} → ${ptsDe(imp)} puntos` : "Escribe el importe del ticket"; }
  if (e.target.id === "filtroSocios" && SOCIOS) pintarListaSocios();
  if (e.target.id === "impParcial"){ vistaParcial(); const er = $("#anError"); if (er) er.textContent = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "buscar") buscarSocio();
  if (e.target.id === "ePass") entrar();
  if (e.target.id === "importe") sumarPuntos();
});

/* Si después de 15 segundos sigue cargando, avisar */
setTimeout(() => { if (S.vista === "cargando"){ S.fallo = "La app tarda demasiado en conectar. Revisa tu conexión a internet y vuelve a intentarlo."; S.vista = "fallo"; pintar(); } }, 15000);

/* Service worker (para poder instalarla) */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
